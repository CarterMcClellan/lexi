[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "lexi"
version = "0.1.0"
description = "Lexi — use multiple LLM providers side by side from Python (Rust core via PyO3)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/badscooter23/lexi"

[tool.maturin]
module-name = "lexi._lexi"
python-source = "python"
