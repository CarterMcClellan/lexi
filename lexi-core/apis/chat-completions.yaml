name: chat-completions
description: "OpenAI-compatible Chat Completions API (/v1/chat/completions)"

auth:
  header: Authorization
  value_prefix: "Bearer "

request:
  method: POST
  path: /chat/completions
  body_schema:
    type: object
    required: [model, messages]
    properties:
      model:
        type: string
        description: "Model ID."
        x-bind: { from: model }
      messages:
        type: array
        description: "Chat history. Content is lowered from the active message via content_mapping."
        x-render:
          template:
            - role: "{{role}}"
              content: "{{content}}"
      temperature:
        type: number
        minimum: 0
        maximum: 2
        description: "Sampling temperature."
        x-cli: { flag: --temperature, alias: -t }
      top_p:
        type: number
        minimum: 0
        maximum: 1
        description: "Nucleus sampling cutoff."
        x-cli: { flag: --top-p }
      n:
        type: integer
        minimum: 1
        description: "Number of completions to generate."
        x-cli: { flag: --n }
      stream:
        type: boolean
        default: false
        description: "Stream the response as SSE events."
        x-cli: { flag: --stream }
        x-include: if_truthy
      stream_options:
        type: object
        properties:
          include_usage: { type: boolean }
        x-include: if_any_child_set
      stop:
        type: [string, array]
        description: "Up to 4 stop sequences."
        x-cli: { flag: --stop, repeat: true }
      max_tokens:
        type: integer
        minimum: 1
        description: "Maximum tokens to generate (deprecated for o-series; use --max-completion-tokens)."
        x-cli: { flag: --max-tokens, alias: -m }
      max_completion_tokens:
        type: integer
        minimum: 1
        description: "Maximum tokens to generate (preferred for newer reasoning models)."
        x-cli: { flag: --max-completion-tokens }
      presence_penalty:
        type: number
        minimum: -2
        maximum: 2
        x-cli: { flag: --presence-penalty }
      frequency_penalty:
        type: number
        minimum: -2
        maximum: 2
        x-cli: { flag: --frequency-penalty }
      logit_bias:
        type: object
        description: "Token-id → bias mapping (-100..+100)."
      seed:
        type: integer
        description: "Deterministic sampling seed."
        x-cli: { flag: --seed }
      logprobs:
        type: boolean
        x-cli: { flag: --logprobs }
      top_logprobs:
        type: integer
        minimum: 0
        maximum: 20
        x-cli: { flag: --top-logprobs }
      response_format:
        type: object
        description: "Output format ({type: text|json_object|json_schema, ...})."
      tools:
        type: array
        items: { type: object }
        x-include: if_non_empty
      tool_choice:
        type: [string, object]
        x-cli: { flag: --tool-choice }
      parallel_tool_calls:
        type: boolean
        x-cli: { flag: --parallel-tool-calls }
      user:
        type: string
        x-cli: { flag: --user }
      service_tier:
        type: string
        enum: [auto, default, flex, priority]
        x-cli: { flag: --tier }
      reasoning_effort:
        type: string
        enum: [minimal, low, medium, high]
        description: "Reasoning effort (newer reasoning models on Chat Completions)."
        x-cli: { flag: --reasoning-effort }
      modalities:
        type: array
        items: { type: string }
        description: "e.g. [text, audio]"
      audio:
        type: object
        description: "Audio output configuration."
      prediction:
        type: object
        description: "Predicted output for speculative decoding."

tool_presets:
  json_object:
    response_format:
      type: json_object

# How canonical message content parts lower into the Chat Completions wire shape.
# text_only_as_string: a single text part renders as a bare string (not an array).
content_mapping:
  text_only_as_string: true
  parts:
    text:
      template: { type: text, text: "{{text}}" }
    image:
      template:
        type: image_url
        image_url: { url: "{{url}}" }

# Input/output modalities this API family can carry (per-model overrides refine).
capabilities:
  input: [text, image]
  output: [text]

response:
  text_extract:
    text_path: "choices[0].message.content"
  metadata:
    model: model
    input_tokens: usage.prompt_tokens
    output_tokens: usage.completion_tokens
    total_tokens: usage.total_tokens
    stop_reason: choices[0].finish_reason
  # Streaming (SSE) — Chat Completions emits unnamed events terminated by data: [DONE]
  stream:
    delta_event: null
    delta_path: choices[0].delta.content
    done_marker: "[DONE]"
