[package]
name = "lexi-desktop"
version = "0.0.0"
edition = "2021"
description = "Lexi desktop app (Tauri) — a thin webview shell over lexi-host."
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
lexi-host = { path = "../lexi-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
