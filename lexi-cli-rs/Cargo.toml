[package]
name = "lexi-cli-rs"
version = "0.1.0"
edition = "2021"
description = "Lexi CLI — a thin Rust shell over lexi-host / lexi-core."
license = "MIT"
publish = false

# The command tree, parser, dispatcher and output live in the library so other
# hosts (the desktop app's CLI console) can run `lexi` commands in-process.
[lib]
name = "lexi_cli"
path = "src/lib.rs"

[[bin]]
name = "lexi"
path = "src/main.rs"

[dependencies]
lexi-host = { path = "../lexi-host" }
lexi-core = { path = "../lexi-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
comfy-table = "7"
rpassword = "7"
serde_yaml = "0.9"
rustyline = "14"
shlex = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
wiremock = "0.6"
