name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Python engine: lint (ruff check) + the full test suite, which includes the
  # language-neutral conformance suite (lexi-cli/tests/test_conformance.py).
  # NOTE: `ruff format --check` and `mypy` are intentionally not gated yet — the
  # pre-existing api_compose.py / cli.py carry format/type debt; wiring those in
  # is a separate cleanup. The cross-OS conformance parity check is the point.
  python:
    name: python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        include:
          # keep a lower-bound check on the minimum supported Python
          - os: ubuntu-latest
            python-version: "3.9"
    defaults:
      run:
        working-directory: lexi-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # lexi-cli's engine now runs through the lexi wheel (Rust core via PyO3).
      - name: Build & install the lexi wheel
        run: pip install ./lexi-python
        working-directory: ${{ github.workspace }}
      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check src tests
      - name: Test (includes conformance suite)
        run: pytest -q

  # Rust engine: fully gated — format, clippy (warnings = errors), and the
  # conformance suite (lexi-core/tests/conformance.rs), which runs the SAME
  # fixtures as Python to prove behavioral parity.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -p lexi-core -- --check
      - name: Clippy (warnings = errors)
        run: cargo clippy -p lexi-core --all-targets -- -D warnings
      - name: Test (conformance parity)
        run: cargo test -p lexi-core

  # Python wheel: the lexi-core engine exposed to Python via PyO3 (lexi-python).
  # Build the wheel and run the SAME conformance fixtures from it — a third
  # engine behind the one oracle. fmt + clippy gate the bindings crate too.
  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -p lexi-python -- --check
      - name: Clippy (warnings = errors)
        run: cargo clippy -p lexi-python -- -D warnings
      - name: Build & install the wheel
        run: pip install ./lexi-python pytest pyyaml
      - name: Conformance (from the wheel)
        run: python -m pytest lexi-python/tests -q

  # Host runtime: the I/O layer (HTTP/auth/config) over lexi-core, plus the thin
  # Rust CLI. Tests drive the compose -> POST -> extract pipeline against a mock
  # HTTP server (wiremock) — no live provider calls.
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -p lexi-host -p lexi-cli-rs -- --check
      - name: Clippy (warnings = errors)
        run: cargo clippy -p lexi-host -p lexi-cli-rs --all-targets -- -D warnings
      - name: Test (mock-server pipeline)
        run: cargo test -p lexi-host
      - name: Build CLI
        run: cargo build -p lexi-cli-rs
