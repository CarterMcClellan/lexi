name: Release

# Build native installers for the desktop app on a version tag and attach them
# to a (draft) GitHub Release. Runs only on tags, so it never gates normal CI.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      # NOTE: builds are UNSIGNED. macOS notarization needs an Apple Developer ID
      # and Windows needs an Authenticode cert — wire those in via secrets when
      # available (see lexi-desktop/README.md).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: lexi-desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Lexi ${{ github.ref_name }}"
          releaseBody: |
            Lexi desktop app — a thin shell over the Rust lexi-core engine.

            These builds are **unsigned**:
            - macOS: right-click the app → Open (to bypass Gatekeeper the first time).
            - Windows: SmartScreen → More info → Run anyway.
          releaseDraft: true
          prerelease: false
