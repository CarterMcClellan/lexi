name: Release

# Build native installers for the desktop app on a version tag and attach them
# to a (draft) GitHub Release. Runs only on tags, so it never gates normal CI.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # One draft release per tag, created before anything uploads; every job and
  # workflow attaches to it by id (see .github/scripts/ensure-release.sh).
  release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.ensure.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BODY: |
            Lexi ${{ github.ref_name }}: the `lexi` CLI, desktop installers and Python wheels.

            Unless signed, these builds are **unsigned**:
            - macOS: right-click the app → Open (to bypass Gatekeeper the first time).
            - Windows: SmartScreen → More info → Run anyway.
        run: echo "id=$(.github/scripts/ensure-release.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

  bundle:
    name: bundle (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    # Code-signing is OPT-IN: the APPLE_* / WINDOWS_* secrets below are empty
    # until you add them, and the steps that use them no-op when empty — so
    # builds stay unsigned (and the workflow green) until the secrets exist.
    #
    # macOS (Developer ID + notarization) — add as repo secrets:
    #   APPLE_CERTIFICATE           base64 of your Developer ID .p12
    #   APPLE_CERTIFICATE_PASSWORD  the .p12 password
    #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: You (TEAMID)"
    #   APPLE_ID                    your Apple ID email
    #   APPLE_PASSWORD              an app-specific password for that Apple ID
    #   APPLE_TEAM_ID               your 10-char Developer Team ID
    # Windows (Authenticode) — add as repo secrets:
    #   WINDOWS_CERTIFICATE          base64 of your code-signing .pfx
    #   WINDOWS_CERTIFICATE_PASSWORD the .pfx password
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # True only when an Apple cert is configured. The Apple env vars must NOT be
      # passed (even empty) to a build that isn't signing — an empty
      # APPLE_CERTIFICATE still makes Tauri attempt (and fail) macOS codesigning.
      APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      # Windows Authenticode: import the .pfx and point tauri.conf.json at its
      # thumbprint. Runs only when a cert secret is present (else unsigned).
      - name: Set up Windows code signing
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = 'lexi-desktop/tauri.conf.json'
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $win = [ordered]@{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm       = 'sha256'
            timestampUrl          = 'http://timestamp.digicert.com'
          }
          $json.bundle | Add-Member -NotePropertyName windows -NotePropertyValue $win -Force
          $json | ConvertTo-Json -Depth 32 | Set-Content $conf
          Write-Host "Configured Windows signing with thumbprint $($cert.Thumbprint)"

      # macOS signing + notarization: tauri-action builds a temporary keychain
      # from APPLE_CERTIFICATE, signs with APPLE_SIGNING_IDENTITY, and notarizes
      # via the Apple ID creds. Runs ONLY when a cert secret exists.
      - name: Build (Apple-signed)
        if: matrix.os == 'macos-latest' && env.APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: lexi-desktop
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}

      # Default build: Linux, Windows (signs via the tauri.conf thumbprint set
      # above when a Windows cert exists), and macOS without an Apple cert. No
      # APPLE_* env, so Tauri never attempts macOS codesigning.
      - name: Build
        if: matrix.os != 'macos-latest' || env.APPLE_SIGNING != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: lexi-desktop
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}
