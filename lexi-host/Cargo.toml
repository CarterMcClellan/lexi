[package]
name = "lexi-host"
version = "0.0.0"
edition = "2021"
description = "Runtime (I/O layer) for Lexi: HTTP transport, config/key loading, and auth over the pure lexi-core engine."
license = "MIT"
publish = false

[dependencies]
lexi-core = { path = "../lexi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
futures-util = "0.3"
base64 = "0.22"
thiserror = "1"
dirs = "5"

sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
fs2 = "0.4"
open = "5"
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
