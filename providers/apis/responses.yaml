name: responses
description: "OpenAI Responses API (/v1/responses)"

auth:
  header: Authorization
  value_prefix: "Bearer "

request:
  method: POST
  path: /responses
  body_schema:
    type: object
    required: [model, input]
    properties:
      model:
        type: string
        description: "Model ID (e.g. gpt-4.1, gpt-4o, o3, o4-mini)."
        x-bind: { from: model }
      input:
        type: array
        description: "Conversation items. Content is lowered from the active message via content_mapping."
        x-render:
          template:
            - role: "{{role}}"
              content: "{{content}}"
      instructions:
        type: string
        description: "Top-level system-style instructions (replaced each request)."
        x-cli: { flag: --instructions }
      temperature:
        type: number
        minimum: 0
        maximum: 2
        description: "Sampling temperature."
        x-cli: { flag: --temperature, alias: -t }
      top_p:
        type: number
        minimum: 0
        maximum: 1
        description: "Nucleus sampling cutoff."
        x-cli: { flag: --top-p }
      max_output_tokens:
        type: integer
        minimum: 1
        description: "Maximum tokens to generate."
        x-cli: { flag: --max-tokens, alias: -m }
      top_logprobs:
        type: integer
        minimum: 0
        maximum: 20
        description: "Return top-N logprobs per token."
        x-cli: { flag: --top-logprobs }
      stream:
        type: boolean
        default: false
        description: "Stream the response as SSE events."
        x-cli: { flag: --stream }
        x-include: if_truthy
      stream_options:
        type: object
        properties:
          include_usage: { type: boolean }
        x-include: if_any_child_set
      background:
        type: boolean
        default: false
        description: "Run as a background response; poll GET /v1/responses/{id} for result."
        x-cli: { flag: --background }
        x-include: if_truthy
      reasoning:
        type: object
        description: "Reasoning controls (o-series / GPT-5 reasoning models)."
        properties:
          effort:
            type: string
            enum: [minimal, low, medium, high]
            x-cli: { flag: --reasoning-effort }
          summary:
            type: string
            enum: [auto, concise, detailed]
            x-cli: { flag: --reasoning-summary }
        x-include: if_any_child_set
      text:
        type: object
        description: "Output text format (use for structured outputs / json mode)."
        properties:
          format: { type: object }
      truncation:
        type: string
        enum: [auto, disabled]
        description: "Context window overflow handling."
        x-cli: { flag: --truncation }
      tools:
        type: array
        items: { type: object }
        description: "Tool definitions (built-in or function tools)."
        x-include: if_non_empty
      tool_choice:
        type: [string, object]
        description: "auto | none | required | { type, name }"
        x-cli: { flag: --tool-choice }
      parallel_tool_calls:
        type: boolean
        description: "Allow multiple tool calls per turn."
        x-cli: { flag: --parallel-tool-calls }
      max_tool_calls:
        type: integer
        minimum: 0
        description: "Hard cap on tool invocations during a single response."
        x-cli: { flag: --max-tool-calls }
      previous_response_id:
        type: string
        description: "Chain onto a prior response.id (server-side conversation state)."
        x-cli: { flag: --continue }
      conversation:
        type: [string, object]
        description: "Attach to a Conversation object."
      prompt_cache_key:
        type: string
        description: "Improves cache hit rate for repeated prefixes."
        x-cli: { flag: --prompt-cache-key }
      store:
        type: boolean
        default: true
        description: "Persist response on OpenAI's servers (required true for previous_response_id)."
      metadata:
        type: object
        description: "Up to 16 key/value pairs echoed back on the response."
      safety_identifier:
        type: string
        description: "Stable per-end-user hash for abuse/safety monitoring."
        x-cli: { flag: --safety-identifier }
      user:
        type: string
        description: "Legacy per-user identifier (safety_identifier is preferred)."
        x-cli: { flag: --user }
      service_tier:
        type: string
        enum: [auto, default, flex, priority]
        description: "Latency / cost tier."
        x-cli: { flag: --tier }
      include:
        type: array
        items: { type: string }
        description: "Extra response fields to include (e.g. file_search_call.results)."
        x-cli: { flag: --include, repeat: true }
        x-include: if_non_empty

tool_presets:
  web_search:
    tools:
      - type: web_search
  json_object:
    text:
      format:
        type: json_object
  reasoning_high:
    reasoning: { effort: high }
  reasoning_minimal:
    reasoning: { effort: minimal }

# How canonical message content parts lower into the Responses wire shape.
content_mapping:
  text_only_as_string: false
  parts:
    text:
      template: { type: input_text, text: "{{text}}" }
    image:
      by_source:
        url:
          template: { type: input_image, image_url: "{{url}}" }
        base64:
          template: { type: input_image, image_url: "{{data_uri}}" }
        file:
          template: { type: input_image, file_id: "{{file_id}}" }

# Input/output modalities this API family can carry (per-model overrides refine).
capabilities:
  input: [text, image]
  output: [text]

# Files API: POST the file (multipart, host-side), then use the returned id as
# an image part's file_id source.
files:
  upload:
    method: POST
    path: /files
    purpose_field: purpose
  id_path: id

# Async lifecycle for background responses (request with background: true):
# submit returns {id, status: queued}; poll GET /responses/{id} until terminal.
operation:
  id_path: id
  status_path: status
  poll:
    method: GET
    path_template: "/responses/{id}"
  status_map:
    pending: [queued]
    running: [in_progress]
    succeeded: [completed]
    failed: [failed, cancelled, incomplete]

response:
  # Generic text extractor: walks output[], picks message items, concatenates
  # each output_text fragment. Works correctly when web_search_call / reasoning
  # / etc. items appear before the assistant message.
  text_extract:
    items_path: output
    item_filter: { type: message }
    content_path: content
    content_filter: { type: output_text }
    text_field: text
  # Tool-use / activity summary surfaced under --verbose.
  activity:
    items_path: output
    summarize_by_type:
      web_search_call:        "{count} web search"
      file_search_call:       "{count} file search"
      code_interpreter_call:  "{count} code exec"
      image_generation_call:  "{count} image gen"
      computer_call:          "{count} computer call"
      mcp_call:               "{count} mcp call"
      function_call:          "{count} function call"
      reasoning:              "reasoning"
  # Citations live on each output_text node under "annotations".
  annotations:
    scope: text_items
    path: annotations
    types:
      url_citation:
        format: "[{i}] {url} — {title}"
      file_citation:
        format: "[{i}] file:{file_id} «{quote}»"
      container_file_citation:
        format: "[{i}] container:{container_id}/{file_id}"
  metadata:
    model: model
    input_tokens: usage.input_tokens
    output_tokens: usage.output_tokens
    total_tokens: usage.total_tokens
    stop_reason: status
  # Streaming (SSE) — see https://platform.openai.com/docs/api-reference/responses-streaming
  stream:
    delta_event: response.output_text.delta
    delta_path: delta
    done_event: response.completed
    final_event: response.completed
    # final_event.data carries the full Response object (we use it for metadata when --verbose).
    # Live status indicators printed to stderr while the request runs.
    activity_events:
      response.web_search_call.searching:        "🔍 searching the web"
      response.web_search_call.completed:        "🔍 search complete"
      response.file_search_call.searching:       "📁 searching files"
      response.file_search_call.completed:       "📁 file search complete"
      response.code_interpreter_call.in_progress: "⚙ running code"
      response.code_interpreter_call.completed:  "⚙ code complete"
      response.image_generation_call.in_progress: "🎨 generating image"
      response.image_generation_call.completed:  "🎨 image complete"
      response.mcp_call.in_progress:             "🔌 mcp call"
      response.mcp_call.completed:               "🔌 mcp complete"
