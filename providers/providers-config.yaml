# Providers. Each entry builds on a shipped template (url, auth, the APIs the
# provider offers, and tag rules for its models) — anything you set here wins.
# See docs/provider-model-design.md. Without `template:`, an entry is fully
# yours: `url`, `api` (or `apis`), `api_key`, `default_model`, ...
providers:
  openai:
    template: openai
  anthropic:
    template: anthropic
  nvidia:
    template: nvidia

defaults:
  max_tokens: 4096
  temperature: 0.5
  role: system
